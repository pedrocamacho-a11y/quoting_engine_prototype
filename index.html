<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · CUBRO</title>
<link rel="stylesheet" href="cubro-identity.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="login">
  <div class="login-box">
    <span class="logo">CUBRO</span>

    <form onsubmit="entrar(event)">
      <div class="f">
        <label for="email">Email</label>
        <input type="email" id="email" value="carolina.mendez@gmail.com">
      </div>
      <div class="f">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" value="cubro2026">
      </div>
      <button class="btn" type="submit">Entrar</button>
    </form>

    <div class="login-alt">
      <p>Entrada del asesor</p>
      <p style="margin-top:10px"><a href="deal.html">Abrir el deal #D-4127 en HubSpot ↗</a></p>
      <p style="margin-top:20px"><a href="#" onclick="reiniciar()">Reiniciar datos de la demo</a></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
function entrar(ev) {
  ev.preventDefault();
  location.href = 'home.html?role=cliente';
}
function reiniciar() {
  resetState();
  toast('Datos de la demo reiniciados: V3 firmada y actual, V1 y V2 de consulta.');
  return false;
}
</script>
</body>
</html>
