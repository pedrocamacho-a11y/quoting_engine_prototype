<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HubSpot · Deals</title>
<link rel="stylesheet" href="cubro-identity.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Prop. Sólo existe para que el Loom muestre que el asesor entra al portal del
     cliente DESDE HubSpot. Nada de clonar HubSpot: una barra y un botón. -->
<div class="hs-bar">
  <span>HubSpot · Deals</span>
  <span id="hsUser"></span>
</div>

<div class="wrap" id="deal"></div>

<script src="app.js"></script>
<script>
function renderDeal() {
  const p = proyectoActual();
  document.getElementById('hsUser').textContent = DEMO.am.nombre;

  document.getElementById('deal').innerHTML = `
    <div class="proj-head">
      <div>
        <div class="proj-title">
          <h1>${p ? p.nombre : 'Nuevo contacto'}</h1>
          <span class="proj-ref">Deal #${DEMO.deal.id}</span>
        </div>
        <div class="proj-dir">${state().perfil.nombre} · ${state().perfil.email}</div>
        <div class="proj-dir">Etapa: <strong style="font-weight:400">${DEMO.deal.etapa}</strong> ·
          propietario: ${DEMO.am.nombre}</div>
      </div>
      <div class="proj-actions">
        <a class="btn" href="${p ? 'project.html?role=am' : 'home.html?role=am'}">Abrir dashboard del cliente ↗</a>
      </div>
    </div>

    <hr class="divider">
    <p class="muted">El asesor no tiene herramienta aparte: entra desde este deal al portal de
      ${state().perfil.nombre} y ve las mismas pantallas con botones extra.</p>`;
}
document.addEventListener('DOMContentLoaded', renderDeal);
</script>
</body>
</html>
